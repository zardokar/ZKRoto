<meta charset="utf-8">
<title>ZKRoto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<header>
  <b data-text="title"></b>
  <div class="zk-slot" data-slot="modeswitch"></div>
  <div class="zk-load">
    <input id="name" class="mono" size="34" data-placeholder="namePlaceholder">
    <button id="btnLoad" class="zk-req-btn" data-icon="go" data-tip-key="loadTip"></button>
    <button id="btnOpen" class="zk-req-btn" data-icon="open" data-tip-key="openTip"></button>
    <input id="file" type="file" accept="video/*,image/*" hidden>
  </div>
  <span class="zk-statuswrap" data-tip-key="logTip">
    <button id="status" type="button" class="zk-status" aria-expanded="false"></button>
    <div id="log" class="mono zk-logdrawer" hidden></div>
  </span>
  <div class="zk-slot" data-slot="header"></div>
  <input id="showPose" type="checkbox" checked hidden>
</header>
<div id="main">
  <nav class="zk-slot zk-toolslot" data-slot="tools"></nav>
  <div id="stagecol">
    <div id="stage">
      <div id="srcpane">
        <div id="drop" data-text="drop"></div>
        <video id="video" muted playsinline preload="auto"></video>
        <img id="still" alt="" style="display: none">
        <canvas id="overlay"></canvas>
        <canvas id="pen"></canvas>
      </div>
      <div class="zk-slot" data-slot="stage"></div>
      <div class="zk-overlayslot" data-slot="overlay"></div>
    </div>
    <footer id="framebar">
      <input id="scrub" type="range" min="0" max="0" value="0">
      <div class="row">
        <button data-step="-30" class="zk-req-btn" data-icon="b30" data-tip-key="back30Tip"></button>
        <button data-step="-1" class="zk-req-btn" data-icon="back" data-tip-key="back1Tip"></button>
        <input id="frame" class="mono" size="6" value="0"><span class="mono zk-total">/ <span id="total">0</span></span>
        <button data-step="1" class="zk-req-btn" data-icon="next" data-tip-key="fwd1Tip"></button>
        <button data-step="30" class="zk-req-btn" data-icon="f30" data-tip-key="fwd30Tip"></button>
        <select id="fps" hidden></select>
        <span class="zk-slot" data-slot="fps"></span>
        <span class="mono" id="tc" data-text="tcEmpty"></span>
        <button id="btnPose" class="primary" data-zk-only="roto" data-text="pose"></button>
        <button id="btnCapture" class="zk-req-btn" data-icon="camera" data-tip-key="capture"></button>
        <span class="zk-slot" data-slot="footer"></span>
      </div>
    </footer>
  </div>
  <aside id="panel" class="zk-slot" data-slot="panel"></aside>
</div>
