<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZKRoto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#16181c; --panel:#1f2228; --line:#2e323a; --fg:#e6e6e6; --dim:#9aa0aa; --acc:#4fa3ff; --ok:#5ccf86; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, "Segoe UI", sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:14px; margin-right:6px; }
  input, button, select { background:#2a2e36; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button.primary { background:#21466e; border-color:#2f6bab; }
  #stage { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage video, #stage canvas { position:absolute; max-width:100%; max-height:100%; }
  #overlay { pointer-events:none; }
  #drop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:15px; }
  footer { padding:6px 12px; background:var(--panel); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  #scrub { width:100%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  #status { color:var(--dim); } #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  #log { max-height:84px; overflow:auto; color:var(--dim); font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <b data-text="title"></b>
  <input id="name" class="mono" size="34" data-placeholder="namePlaceholder">
  <button id="btnLoad" data-text="load"></button>
  <label><span data-text="orFile"></span> <input id="file" type="file" accept="video/*"></label>
  <label><span data-text="fps"></span> <select id="fps"></select></label>
  <label><input id="showPose" type="checkbox" checked> <span data-text="poseOverlay"></span></label>
</header>
<div id="stage">
  <div id="drop" data-text="drop"></div>
  <video id="video" muted playsinline preload="auto"></video>
  <canvas id="overlay"></canvas>
</div>
<footer>
  <input id="scrub" type="range" min="0" max="0" value="0">
  <div class="row">
    <button data-step="-30" data-text="back30"></button>
    <button data-step="-1" data-text="back1"></button>
    <span class="mono"><span data-text="frameLabel"></span> <input id="frame" class="mono" size="6" value="0"> / <span id="total">0</span></span>
    <button data-step="1" data-text="fwd1"></button>
    <button data-step="30" data-text="fwd30"></button>
    <span class="mono" id="tc" data-text="tcEmpty"></span>
    <button id="btnCapture" class="primary" data-text="capture"></button>
    <button id="btnPose" data-text="pose"></button>
    <span id="status"></span>
  </div>
  <div id="log" class="mono"></div>
</footer>
<script type="importmap">
{
  "imports": {
    "./js/zk_bits.js": "./js/zk_bits.js?v=0.1.3",
    "./js/zk_capture.js": "./js/zk_capture.js?v=0.1.3",
    "./js/zk_context.js": "./js/zk_context.js?v=0.1.3",
    "./js/zk_frames.js": "./js/zk_frames.js?v=0.1.3",
    "./js/zk_main.js": "./js/zk_main.js?v=0.1.3",
    "./js/zk_overlay.js": "./js/zk_overlay.js?v=0.1.3",
    "./js/zk_pose.js": "./js/zk_pose.js?v=0.1.3",
    "./js/zk_poseshape.js": "./js/zk_poseshape.js?v=0.1.3",
    "./js/zk_selftest.js": "./js/zk_selftest.js?v=0.1.3",
    "./js/zk_text.js": "./js/zk_text.js?v=0.1.3",
    "./js/zk_ui.js": "./js/zk_ui.js?v=0.1.3",
    "./js/zk_video.js": "./js/zk_video.js?v=0.1.3",
    "./config/zkroto.json": "./config/zkroto.json?v=0.1.3",
    "./constants/zkroto.json": "./constants/zkroto.json?v=0.1.3"
  }
}
</script>
<script type="module" src="js/zk_main.js?v=0.1.3"></script>
</body>
</html>
